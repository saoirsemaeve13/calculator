<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="style.css" />
    <script src="javascript.js" defer></script>
    <title>Document</title>
  </head>
  <body></body>
  <div class="header"></div>
  <div class="mainContent">
    <div class="calculatorBody">
      <div class="calculatorScreen"></div>
      <div class="calculatorButtons">
        <div class="calculatorNumbers">
          <div class="nine">9</div>
          <div class="eight">8</div>
          <div class="seven">7</div>
          <div class="six">6</div>
          <div class="five">5</div>
          <div class="four">4</div>
          <div class="three">3</div>
          <div class="two">2</div>
          <div class="one">1</div>
          <div class="delete">del</div>
          <div class="zero">0</div>
          <div class="decimal">.</div>
        </div>
        <div class="calculatorOperators">
          <div class="addition">+</div>
          <div class="subtraction">-</div>
          <div class="multiplication">*</div>
          <div class="division">/</div>
          <div class="exponent">^</div>
          <div class="factorial">!</div>
          <div class="allClear">AC</div>
        </div>
      </div>
    </div>
  </div>
</html>
