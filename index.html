<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="javascript.js" defer></script>
    <title>Document</title>
  </head>
  <body></body>
  <div class="header"></div>
  <div class="mainContent">
    <div class="calculatorBody">
      <div class="calculatorScreen">Testing 123</div>
      <div class="calculatorButtons">
        <div class="calculatorNumbers">
          <button class="numberButtons" id="nine">9</button>
          <button class="numberButtons" id="eight">8</button>
          <button class="numberButtons" id="seven">7</button>
          <button class="numberButtons" id="six">6</button>
          <button class="numberButtons" id="five">5</button>
          <button class="numberButtons" id="four">4</button>
          <button class="numberButtons" id="three">3</button>
          <button class="numberButtons" id="two">2</button>
          <button class="numberButtons" id="one">1</button>
          <button class="numberButtons" id="delete">del</button>
          <button class="numberButtons" id="zero">0</button>
          <button class="numberButtons" id="decimal">.</button>
        </div>
        <div class="calculatorOperators">
          <button class="operatorButtons" id="addition">+</button>
          <button class="operatorButtons" id="subtraction">-</button>
          <button class="operatorButtons" id="multiplication">*</button>
          <button class="operatorButtons" id="division">/</button>
          <button class="operatorButtons" id="exponent">^</button>
          <button class="operatorButtons" id="factorial">!</button>
          <button class="operatorButtons" id="allClear">AC</button>
        </div>
      </div>
    </div>
  </div>
</html>
